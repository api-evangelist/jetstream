name: Jetstream
description: 'Jetstream (jetstream.security) is a security-first AI governance platform for enterprises,
  backed by Redpoint Ventures. It helps organizations discover, control, and monitor AI systems at scale
  across five capabilities: AI Visibility (discovering and inventorying AI agents, models, tools, and
  workflows across environments), AI Design Control (documenting how agentic systems are assembled),
  Agentic Identity (binding human and AI identities to responsible owners), Runtime Governance (enforcing
  real-time behavioral compliance against approved designs), and AI FinOps Accountability (tracking usage
  and spend by model, agent, and workflow). The company positions governance as an accelerator for AI
  adoption, addressing shadow AI, cost control, accountability, and compliance. No public API, SDK, CLI,
  or developer portal is published as of this profile; the company pursues SOC 2, FedRAMP High, and DoD
  IL5 compliance.'
